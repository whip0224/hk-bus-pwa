<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="minibusBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Double-decker bus silhouette -->
  <g transform="translate(106, 80)">
    <!-- Main bus shell -->
    <rect x="0" y="20" width="300" height="310" rx="36" fill="url(#busBody)" stroke="#FECACA" stroke-width="6"/>
    
    <!-- Upper deck windshield -->
    <rect x="24" y="44" width="252" height="74" rx="14" fill="#E0F2FE" opacity="0.95"/>
    <line x1="150" y1="44" x2="150" y2="118" stroke="#94A3B8" stroke-width="4"/>

    <!-- Middle dividing strip -->
    <rect x="10" y="132" width="280" height="18" rx="6" fill="#FACC15"/>

    <!-- Lower deck windshield & destination display -->
    <rect x="50" y="160" width="200" height="34" rx="8" fill="#18181B"/>
    <text x="150" y="183" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#FACC15" text-anchor="middle" letter-spacing="2">HK TRANSIT</text>
    
    <rect x="24" y="204" width="252" height="74" rx="14" fill="#E0F2FE" opacity="0.95"/>
    <line x1="150" y1="204" x2="150" y2="278" stroke="#94A3B8" stroke-width="4"/>

    <!-- Headlights -->
    <circle cx="50" cy="300" r="14" fill="#FEF08A"/>
    <circle cx="250" cy="300" r="14" fill="#FEF08A"/>
    <rect x="100" y="294" width="100" height="12" rx="4" fill="#475569"/>

    <!-- Wheels -->
    <rect x="40" y="324" width="50" height="26" rx="8" fill="#0F172A"/>
    <rect x="210" y="324" width="50" height="26" rx="8" fill="#0F172A"/>
  </g>

  <!-- Green Minibus badge circle -->
  <g transform="translate(320, 310)">
    <circle cx="70" cy="70" r="66" fill="url(#minibusBadge)" stroke="#FFFFFF" stroke-width="8" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
    <text x="70" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">小巴</text>
    <text x="70" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#A7F3D0" text-anchor="middle">GMB</text>
  </g>
</svg>
